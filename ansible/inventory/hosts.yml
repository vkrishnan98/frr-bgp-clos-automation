all:
  vars:
    ansible_connection: local
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
  children:
    spines:
      hosts:
        spine1:
          container_name: clab-fabric-spine1
          loopback: 10.0.0.1
          local_asn: 65000
        spine2:
          container_name: clab-fabric-spine2
          loopback: 10.0.0.2
          local_asn: 65000
    leaves:
      hosts:
        leaf1:
          container_name: clab-fabric-leaf1
          loopback: 10.0.0.11
          local_asn: 65101
        leaf2:
          container_name: clab-fabric-leaf2
          loopback: 10.0.0.12
          local_asn: 65102
    edge:
      hosts:
        edge1:
          container_name: clab-fabric-edge1
          loopback: 10.0.0.21
          local_asn: 65200
